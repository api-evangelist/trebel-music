aid: trebel-music
name: TREBEL Music
description: >-
  TREBEL Music (operated by M&M Media, Inc.) is an advertising-sponsored, legally licensed
  music download and streaming service that lets people download and listen to music offline
  at no cost. Founded in 2014 by Gary Mekikian, Corey Jones and Luis Soto Durazo and
  headquartered in Stamford, Connecticut with offices in Mexico City, Jakarta, Bogota,
  Los Angeles and Miami, TREBEL licenses catalog from Universal Music Group, Sony Music
  Entertainment, Warner Music Group and independent labels, and monetizes through digital
  advertising, branded experiences, virtual goods and a TREBEL Max tier rather than a
  conventional paid subscription. TREBEL is a consumer mobile product distributed through
  the Apple App Store, Google Play and Huawei AppGallery; it publishes no public developer
  program, API reference, SDK or machine-readable contract.
