  detail: >-
    TREBEL is a consumer music app with no developer program at all — its sitemap lists 45
    pages and not one is a developer portal, API reference or spec, and api.trebel.io is a
    private nginx backend for the mobile apps that returns 404 on its root and on every
    OpenAPI/GraphQL/MCP/agent-card path probed.
